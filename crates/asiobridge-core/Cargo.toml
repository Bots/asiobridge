[package]
name = "asiobridge-core"
version.workspace = true
edition.workspace = true

[dependencies]
cpal = "0.15"
rubato = "0.14"
ringbuf = "0.5"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
